system: ks
data_generation:
  num_grid_points: 128
  L: 22.0
  initial_modes: [1, 2, 3]
  initial_amplitude: 0.1
  internal_dt: 0.25
  etdrk4_contour_points: 64
  dealiasing: two_thirds
  dt: 0.25
  duration: 22000.0
  burn_in_steps: 8000
preprocessing:
  num_delay_samples: 1
  sampling_stride: 1
  spatial_subsample: 2
split:
  train_valid_ratio: 0.5
  train_ratio: 0.9
data_dir: data
evaluation:
  steps_per_lt: 70.5
  horizon_lt: 5.0
  num_rollout_starts: 3000
  vpt_epsilons: [0.5]
  vrmse_windows_lt: [[0.5, 0.7]]
  vrmse_eps: 1.0e-7
  vpt_sigma_eps: 1.0e-12
  rollout_seed: 0
  rollout_svd_rank: 0.999

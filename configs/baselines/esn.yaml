system: lorenz63
latent_multiplier: 1
seed: 0
data: configs/data/{system}.yaml
output:
  dir: outputs
model:
  name: esn
  latent_dim: input
  scale_inputs: true
  rollout_batch_size: 500
  sr: 0.9
  lr: 0.3
  input_scaling: 1.0
  input_connectivity: 0.1
  rc_connectivity: 0.1
  ridge: 1.0e-6
  fit_bias: true
  activation: tanh
  warmup: 100
  history_steps: num_delay_samples

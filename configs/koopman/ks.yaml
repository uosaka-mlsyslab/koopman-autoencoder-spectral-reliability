system: ks
latent_multiplier: 1
seed: 0
data: configs/data/{system}.yaml
output:
  dir: outputs
model:
  name: koopman_autoencoder
  latent_dim: input
  encoder:
    hidden_layers: 2
    hidden_width: latent
    activation: relu
  decoder:
    hidden_layers: 2
    hidden_width: latent
    activation: relu
loss:
  type: spectral_residual
  operator_norm_weight: 0.0
  residual_backward: custom
pretrained:
  enabled: true
  dir: checkpoints
  seed: 99
  updates: 300000
  learning_rate: 0.0003
  batch_size: 2048
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  min_lr_fraction: 0.01
  initial_conditions: dataset
optimizer:
  name: adamw
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01
  learning_rate_reconstruction: 0.0001
  learning_rate_evolution: 0.0001
  learning_rate_joint: 0.0001
scheduler:
  t_max: 180
  warmup_epochs: 20
  min_lr: 1.0e-8
training:
  procedure: two_stage
  precision: auto
  epochs: 200
  batch_size: 2048
  max_updates_reconstruction: 250
  max_updates_evolution: 250
  max_updates_joint: 250
  plateau_window: 150
  plateau_relative_improvement_rate_tolerance: 0.01
  disjoint_pools: true
  pool_block_lt: 2.0
  grad_clip_max_norm: 0.01
  joint_loss_weights: [2.0, 1.0]
  operator_regularization: 1.0e-6
